name: Build Game
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          unzip -o retro-platformer-game-development.zip
          node -e "const fs = require('fs'); let h = fs.readFileSync('index.html', 'utf8'); h = h.replace('</head>', '<script src=\"https://crazygames.com\"></script></head>'); fs.writeFileSync('index.html', h);"
          npm install --legacy-peer-deps
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: crazygames-ready
          path: dist/
